name: Build Windows (烬序影墟)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 删除旧 lock，用 npm install 按 file: 引用解析本地包
      - name: Install frontend dependencies
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install

      - name: Build frontend (dist)
        run: npm run build

      # ffmpeg.exe 不入库（.gitignore），CI 现场下载 BtbN 官方构建供 bundle.resources 引用
      - name: Download ffmpeg for bundling
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "ffmpeg.exe not found in archive"; exit 1 }
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item $exe.FullName src-tauri/resources/ffmpeg.exe -Force
          Write-Output "ffmpeg.exe -> src-tauri/resources/ffmpeg.exe ($([math]::Round((Get-Item src-tauri/resources/ffmpeg.exe).Length/1MB,1)) MB)"

      - name: Build Windows installer (NSIS)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 烬序影墟-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 发布为 GitHub Release（公开资产，可匿名下载；官网下载可直接指向 Release asset）
      - name: Publish Windows Release (auto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $TAG = "win-${env:GITHUB_RUN_NUMBER}"
          $SETUPS = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -ExpandProperty FullName
          $ARGS = @('release','create', $TAG, '--repo', "$env:GITHUB_REPOSITORY", '--title', "烬序影墟 Windows Build #$env:GITHUB_RUN_NUMBER", '--notes', '自动构建产物（NSIS 安装包，可直接安装）', '--clobber') + $SETUPS
          gh $ARGS 2>&1 | Write-Output
          if ($LASTEXITCODE -ne 0) { Write-Output "release 已存在或失败，跳过" }
