name: ci: Windows打包 workflow（下载ffmpeg、NSIS安装包）

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Download ffmpeg.exe into resources
        shell: pwsh
        run: |
          $dest = "src-tauri/resources/ffmpeg.exe"
          if (-not (Test-Path $dest)) {
            $urls = @(
              "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip",
              "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
            )
            $ok = $false
            foreach ($u in $urls) {
              try {
                Invoke-WebRequest -Uri $u -OutFile "$env:TEMP\ffmpeg.zip" -UseBasicParsing
                $ok = $true
                break
              } catch {
                Write-Output "download failed: $u"
              }
            }
            if (-not $ok) { throw "ffmpeg download failed" }
            Expand-Archive "$env:TEMP\ffmpeg.zip" "$env:TEMP\ffzip" -Force
            $bin = Get-ChildItem "$env:TEMP\ffzip" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            if (-not $bin) { throw "ffmpeg.exe not found in archive" }
            Copy-Item $bin.FullName $dest -Force
          }
          Write-Output "ffmpeg.exe size: $((Get-Item $dest).Length)"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Tauri build (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '烬序影墟 ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包（NSIS）'
          releaseDraft: true
          args: --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: 烬序影墟-win-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
